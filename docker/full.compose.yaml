services:
  postgres-ui:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    ports:
      - "4983:4983"
    environment:
      MASTERPASS: ${MASTERPASS:?definí MASTERPASS en .env}
      DATABASE_URL_app: "postgresql://${POSTGRES_USER:?definí POSTGRES_USER en .env}:${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:?definí POSTGRES_DB en .env}"
    volumes:
      - drizzle-data:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  drizzle-data:
