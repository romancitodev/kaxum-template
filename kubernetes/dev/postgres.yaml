apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      nodeSelector:
        data: pg # el worker que tiene montado /data/pg (ver kind.config.yaml)
      containers:
        - name: postgres
          image: postgres:alpine3.24
          # default (100) queda justo con 10 réplicas de la API a 10 conexiones
          # cada una (ver `App::new` en src/app.rs): un poco de margen.
          args: ["-c", "max_connections=300"]
          ports:
            - name: pg
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials # lo crea `just k8s-secrets` desde .env
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql # without /data because of the new versions.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
      volumes:
        - name: data
          hostPath:
            path: /data/pg
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
